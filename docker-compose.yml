services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: ernote }
    ports: ["5433:5432"]
  s3:                                   # S3-compatible (RustFS; MinIO's images were withdrawn)
    image: rustfs/rustfs:1.0.6
    environment: { RUSTFS_ACCESS_KEY: dev, RUSTFS_SECRET_KEY: devdevdev }
    ports: ["9000:9000", "9001:9001"]   # console: http://localhost:9001/rustfs/console/
  elasticmq:                            # SQS-compatible
    image: softwaremill/elasticmq-native
    ports: ["9324:9324"]
