<!doctype html><html lang="en"><meta charset="utf-8"><title>ER Note API</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui.css" integrity="sha384-4c3vsE5f+trhFyHrFrLM1fFGUn531NIaC7dcqEWIJdoRQJ5CkJbSuSCwXLpaS1KF" crossorigin="anonymous">
<label>Access token <input id="token" type="password" autocomplete="off"></label><button id="open">Load API</button><div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.34.1/swagger-ui-bundle.js" integrity="sha384-XFYN47VzPiDY6qPtxYKg0nqUeW/upo20xf1j2SUE7gT/i35FJB4cuS/71Iegzk8Z" crossorigin="anonymous"></script>
<script>document.getElementById('open').onclick = () => {
const token = document.getElementById('token').value; document.getElementById('token').value = '';
SwaggerUIBundle({url:'/api-docs/openapi.json',dom_id:'#swagger-ui',persistAuthorization:false,
requestInterceptor: req => {if (new URL(req.url,location.href).origin === location.origin) req.headers.Authorization='Bearer '+token; return req;}});
};</script></html>
