
[package]

name = "er-api"

edition.workspace = true

version.workspace = true

# Serde-only. The "client" feature (S9) adds the optional deps — nothing here yet.

[dependencies]
schemars = { workspace = true, optional = true }

er-domain.workspace = true
er-store = { workspace = true, optional = true }

async-trait = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json  = { workspace = true, optional = true }
uuid.workspace = true


[features]
schema = ["dep:schemars", "dep:serde_json", "er-domain/schema"]
client = ["dep:er-store", "dep:reqwest", "dep:async-trait", "dep:serde_json"]

# Tests pin the JSON field names of the wire contract, so they need a JSON codec
# regardless of which features a consumer turns on. A dev-dependency keeps
# serde_json out of the shipped (no-feature) dependency graph.
[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[[example]]
name = "remote_smoke"
required-features = ["client"]

[[example]]
name = "openapi"
required-features = ["schema"]
