[package]
name = "er-server"
edition.workspace = true
version.workspace = true
default-run = "er-server"

[dependencies]
async-trait = "0.1.89"
anyhow = { version = "1.0", default-features = true }
axum = "0.8.9"
base64 = "0.22"
chrono.workspace = true
dotenvy.workspace = true
er-app = { version = "0.1.0", path = "../er-app" }
er-api.workspace = true
hmac = "0.12"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
moka = {version = "0.12", features = ["future"] }
rsa = "0.9"
reqwest.workspace = true
# S8 backend-hop TLS. The provider is chosen explicitly in `tls.rs`; no default
# features, so no new crates enter the lockfile.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["trace", "timeout"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
uuid = { workspace = true, features = ["v4"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
er-store = { version = "0.1.0", path = "../er-store" }
er-domain = { version = "0.1.0", path = "../er-domain" }
er-ai = { workspace = true, features = ["bedrock"] }

# S7: the transcription worker's STT seam. This is the ONLY line in the workspace
# that turns the `cloud-stt` fence on — every other consumer of er-pipeline
# (er-app, er-cli, a future iOS build) takes it default-off and therefore compiles
# no HTTP client through this crate (§C8, D6.21).
er-pipeline = { workspace = true, features = ["cloud-stt"] }


# er-server/Cargo.toml [dependencies]:
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sqs.workspace = true


# One production image carries separate API, worker, and one-shot migration and
# database-bootstrap entrypoints. ECS must override entryPoint, not command, for
# all but the API.
[[bin]]
name = "er-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "er-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "er-db-bootstrap"
path = "src/bin/db_bootstrap.rs"

[[bin]]
name = "er-onboard"
path = "src/bin/onboard.rs"

# Tests drive the server through the real client (S9): `RemoteRepository` runs the
# same Repository contract suite SQLite and Postgres pass, over HTTP. Only the test
# build turns on `client`; the server binary still links DTOs only (§C9).
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
er-api = { workspace = true, features = ["client"] }
