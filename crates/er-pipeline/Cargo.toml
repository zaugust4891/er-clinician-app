[package]
name = "er-pipeline"
edition.workspace = true
version.workspace = true

# Audio capture + speech-to-text traits and mocks. Kept nearly dep-free so the
# future on-device build never pulls in cloud machinery.
[dependencies]
er-domain.workspace = true
thiserror.workspace = true

# Cloud-only, and only reachable through `cloud-stt`. Both are unused until S6's
# DeepgramTranscriber arrives; declaring the fence first is what lets the
# no-feature dependency tree be checked before there is anything to hide.
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# The device fence, same shape er-api uses for its `client` half. Default-off:
# `cargo build -p er-pipeline` compiles no HTTP client at all, which is the
# property a Phase 5 iOS build depends on.
cloud-stt = ["dep:reqwest", "dep:serde_json"]

[dev-dependencies]
# For #[tokio::test] only — SpeechToText is async. A dev-dependency is compiled
# for `cargo test` and nothing else, so the shipped graph stays as it was.
tokio.workspace = true
