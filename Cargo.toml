[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Single source of version truth for third-party dependencies. Each crate
# opts in with `<dep>.workspace = true`.
[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
dashmap = "6"
regex = "1"
dotenvy = "0.15"
sha2 = "0.10"

#aws deps
aws-config = "1"
# Keep the modern TLS client; the SDKs' additional `rustls` default feature
# enables the obsolete Hyper 0.14 / rustls 0.21 compatibility stack as well.
# All other S3/SQS defaults are retained. See the S6 security review.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }


# Internal crates — the dependency graph is the architecture (arrows inward).
er-domain = { path = "crates/er-domain" }
er-store = { path = "crates/er-store" }
er-ai = { path = "crates/er-ai" }
er-pipeline = { path = "crates/er-pipeline" }
er-app = { path = "crates/er-app" }
er-api = { path = "crates/er-api" }

# Platform-specific (added behind feature flags when needed)
# cpal = "0.15"        # Audio capture (iOS support experimental)
# whisper-rs = "0.12"  # On-device STT
# uniffi = "0.28"      # Swift/Kotlin FFI bridge
# aes-gcm = "0.10"     # Encryption at rest
